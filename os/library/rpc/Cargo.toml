[package]
name = "rpc"
version = "0.1.0"
edition = "2024"
authors = ["Yannis Wagner <yannis.wagner@hhu.de>"]

[lib]
test = false
doctest = false
bench = false

[features]
default = ["userspace"]
userspace = []

[dependencies]
capnp = { version = "0.13", default-features = false }
naming = { path = "../../library/naming" }
syscall = { path = "../../library/syscall" }
terminal = { path = "../../library/terminal" }
concurrent = { path = "../../library/concurrent" }
time = { path = "../../library/time" }
log = "0.4.26"
logger = { path = "../../library/logger" }

[build-dependencies]
capnpc = "0.13"

